<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b16">
  <title>Admin — V-Client</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./admin.css">
  <script src="./admin.js" defer></script>
</head>
<body class="admin">
  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="panel login-panel">
      <h1>V-Client admin</h1>
      <p class="muted">Sign in with an administrator account.</p>
      <label>Username or email<input name="login" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="button button-primary" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app-view" hidden>
    <header class="admin-bar">
      <b class="admin-brand">V<span>-CLIENT</span> <small>ADMIN</small></b>
      <nav class="admin-tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
        <button role="tab" data-tab="news" aria-selected="false">News</button>
        <button role="tab" data-tab="announcements" aria-selected="false">Announcements</button>
        <button role="tab" data-tab="releases" aria-selected="false">Updates</button>
        <button role="tab" data-tab="users" aria-selected="false">Users</button>
      </nav>
      <span class="admin-user"><span id="who"></span> <button id="logout" class="link-button" type="button">Sign out</button></span>
    </header>
    <p id="toast" class="toast" role="status" hidden></p>

    <main class="admin-main">
      <section id="tab-dashboard" class="tab"></section>
      <section id="tab-news" class="tab" hidden></section>
      <section id="tab-announcements" class="tab" hidden></section>
      <section id="tab-releases" class="tab" hidden></section>
      <section id="tab-users" class="tab" hidden></section>
    </main>
  </div>
</body>
</html>
